modLoader = "javafml"
loaderVersion = "[47,)"
license = "GPL-3.0-only"
issueTrackerURL = "https://github.com/2779789119/Infinite_Stats/issues"

[[mods]]
    modId = "infinitestats"
    version = "${mod_version}"
    displayName = "infinite_stats-无限加点"
    authors = "${mod_authors}"
    # 游戏内「模组列表」的图标，路径相对 jar 根目录（src/main/resources/logo.png）
    logoFile = "logo.png"
    description = '''
    A Terraria-like infinite stat point system for Minecraft 1.20.1 (Forge).

    Kill mobs and gain passive XP to level up, then freely allocate attribute
    points into any stat - there is no level cap, and points can always be
    refunded and re-spent.

    - 108 built-in stats in 4 categories: Attack / Defense / Mobility / Utility
    - Auto-discovery: attributes registered by other mods appear as an
      "External" category and can be leveled exactly like built-in ones
    - Ships with Chinese translations for 30+ mods external attributes,
      so raw keys like [gunsmithlib:bullet_damage] are never shown
    - Toggle abilities: Flight, Night Vision, Vein Miner, Auto Smelt, Auto Fish,
      Eat When Full (keep eating food when your hunger bar is full),
      Infinite Arrows, Infinite Ammo / Zero Heat / No Recoil for TACZ and
      Superb Warfare guns, Infinite Energy (FE / RF / Mekanism / Thermal / EIO /
      Immersive Engineering) and Infinite Health for Superb Warfare vehicles,
      Keep Inventory, No Fall Damage and many more
    - Panels: Stats (P), HUD (H), Item Editor (O), EMC Transmutation (V),
      Achievements (U) and Waypoints (Y)
    - Portable stations: crafting table, furnace, anvil, enchanting table,
      stonecutter, loom, cartography table, grindstone, ender chest
      (can pull materials from Refined Storage / AE2 / other storage networks)
    - Per-player feature switches (pack authors can gate content and unlock it
      later with /infstats feature)
    - Full multiplayer support: stats, EMC and waypoints are stored per player
      and synced to the server
    - No required dependencies
    - Optional: pinyin_search powers the pinyin search boxes; it is embedded in
      the "-all" build, the plain build needs it installed separately
      (without it the search boxes fall back to plain text matching)
    '''

[[dependencies.infinitestats]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.infinitestats]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.21)"
    ordering = "NONE"
    side = "BOTH"

# 拼音搜索（通用拼音搜索库）—— 已由 jarJar 内嵌，玩家无需另装；这里只声明版本关系，各界面搜索框据此启用拼音
[[dependencies.infinitestats]]
    modId = "pinyin_search"
    mandatory = false
    versionRange = "[1.1.0,2.0.0)"
    ordering = "NONE"
    side = "CLIENT"

# 可选：配置界面（Cloth Config API）——「模组列表 → Config」按钮用它画配置界面
[[dependencies.infinitestats]]
    modId = "cloth_config"
    mandatory = false
    versionRange = "[11.0,)"
    ordering = "NONE"
    side = "CLIENT"