# -Xmx4G + 固定 metaspace：reobfJar 重映射是内存密集型，3G 偏紧会导致 GC 抖动
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
# 常驻 daemon：避免每次构建都重跑 ForgeGradle 的配置阶段
org.gradle.daemon=true
# 并行 + 本地构建缓存
org.gradle.parallel=true
org.gradle.caching=true
# 跳过 ForgeGradle 对 maven.minecraftforge.net 的证书预检（本机网络过不了这道预检时插件 apply 阶段就会失败）
systemProp.net.minecraftforge.gradle.check.certs=false

minecraft_version=1.19.2
forge_version=43.2.0
mappings_channel=official
mappings_version=1.19.2

jei_version=11.80.0.1094
cloth_config_version=8.3.134

mod_id=infinitestats
mod_name=infinite_stats-无限加点
mod_version=1.81.5
mod_authors=佚名既无名
mod_description=Terraria-like infinite stat point system for Minecraft 1.19.2 (Forge): level up by killing mobs, then allocate points across 113 built-in stats (Attack / Defense / Mobility / Utility) plus auto-discovered attributes from other mods; portable crafting/furnace/anvil/enchanting stations, creature attribute panel, item editor, EMC transmutation and full multiplayer sync.
