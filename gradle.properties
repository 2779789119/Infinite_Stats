# -Xmx4G + 固定 metaspace：reobfJar 重映射是内存密集型，3G 偏紧会导致 GC 抖动
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
# 常驻 daemon：避免每次构建都重跑 ForgeGradle 的配置阶段（这是构建慢的主因）
org.gradle.daemon=true
# 并行 + 本地构建缓存
org.gradle.parallel=true
org.gradle.caching=true
# 跳过 ForgeGradle 对 maven 仓库（maven.minecraftforge.net）的证书预检：
# 本机网络（代理 / 杀软中间人证书等）过不了这道预检时，插件 apply 阶段就会直接失败
# （报 "Failed to validate certificate for host"）。这只是 FG 自己的一次连通性预检，
# 关掉后真正的依赖下载依旧走 JDK 的正常 TLS 校验；网络正常的环境也可以保留，无副作用。
systemProp.net.minecraftforge.gradle.check.certs=false

