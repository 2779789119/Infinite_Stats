buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
    }
}

plugins {
    // Mixin（用于接管 AnvilMenu 的「过于昂贵」门槛与最终消耗计算）
    id 'org.spongepowered.mixin' version '0.7.+' apply false
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = "${mod_version}"
group = 'com.infinitestats'
archivesBaseName = "infinite_stats-无限加点-${minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // 第三方模组联动的「编译期存根」（源码在 src/compatApiStub/java）：
    // Mixin 注解处理器要求 @Mixin 的目标类必须在**编译期**类路径上，否则报
    // "Mixin target ... could not be found" 直接让构建失败；而 TACZ / Superb Warfare 对本模组
    // 只是「装了才生效」的可选运行时联动 —— 把对方几十 MB 的 jar 塞进仓库不合适，也会随
    // 对方升级变味。所以这里只把「被注入 / 被反射用到的成员」编译成空壳，
    // 通过下面的 main.compileClasspath 供编译期使用；它的产物**不会**进 jar，运行时也永远不会被加载。
    compatApiStub {
        java.srcDir 'src/compatApiStub/java'
        // 存根只用到原版类（ItemStack / Player / LivingEntity …），直接复用主源集的编译类路径。
        // 注意这里取的是 configurations.compileClasspath 本身（而不是 sourceSets.main.compileClasspath）：
        // 后者在下面被并入了存根的产物，写在一起会变成「任务依赖自己的产物」的循环依赖。
        compileClasspath = configurations.compileClasspath
    }
    // 把存根产物只加到**主源集的编译类路径**上：Mixin 注解处理器据此解析 com.tacz.* 等目标，
    // 但不会进 jar（jar 只打包 sourceSets.main.output 里的类，而存根在另一个源集的输出目录里）。
    main.compileClasspath += sourceSets.compatApiStub.output
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: "${mappings_channel}", version: "${mappings_version}"

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Mixin 调试运行：refmap 里存的是 SRG 名，dev 环境需要按映射反查回 official 名
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('.modmind/gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.gameTest
                }
            }
        }
    }
}

repositories {
    maven {
        // JEI
        url "https://maven.blamejared.com/"
    }
    maven {
        // Cloth Config API（配置界面控件库）
        url "https://maven.shedaniel.me/"
    }
    maven {
        // pinyin_search（通用拼音搜索库）的坐标来源
        url "https://jitpack.io"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // JEI（仅编译期需要 API；运行时由整合包内的 JEI 提供）
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // Cloth Config API（用来画模组列表 →「Config」按钮打开的配置界面）
    compileOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")
    runtimeOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")

    // pinyin_search（通用拼音搜索库，包名 com.pinyinsearch / modId pinyin_search）
    // —— 编译期 API + 内嵌变体（JAR-in-JAR，见下面「打包」一节：
    // 标准名产物**不**内嵌它，内嵌的那份是 `-all`）
    // transitive = false：JitPack 发布出来的 POM 把 Forge / MC 的一堆库都算作它的依赖
    // （netty / asm / antlr4 / oshi / brigadier / patchy / srgutils…），
    // 不切断传递依赖的话 jarJar 会把它们全部嵌进本模组（实测主 jar 从 875 KB 涨到 91.7 MB / 116 个嵌套 jar）。
    // 我们只需要它自己那一个 mod jar；它真正需要的 fastutil 由 MC 自带。
    compileOnly('com.github.2779789119:pinyinsearch:1.1.3') { transitive = false }
    // 注意：jarJar 只接受 maven 区间版本（写精确版本会报 "The given version specification is invalid"）
    jarJar('com.github.2779789119:pinyinsearch:[1.1.0,2.0.0)') { transitive = false }

    // Mixin 注解处理器：生成 refmap（把 official 名映射成生产环境的 SRG 名）
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// ============================================================
// Mixin 配置
// ============================================================
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// refmap 虽然由 Mixin 注解处理器在 compileJava 里生成（MixinGradle 把它写到
// build/tmp/compileJava/${mod_id}.refmap.json），但 Gradle 并不知道它是本任务的产物。
// 一旦 compileJava 走「增量恢复 / 命中共建缓存」这条路径（本项目开了 org.gradle.caching=true，
// clean 之后的第二次构建必然 FROM-CACHE），只还原**已声明**的输出，这个文件不会被还原：
//   → addMixinsToJar 找不到 refmap，jar 里就没有 ${mod_id}.refmap.json
//   → 生产环境 Mixin 无法把 `moveRelative` / `createResult` / `setDeltaMovement` 这些成员名
//     转成 SRG 名（报 No refMap loaded），所有注入 Critical injection failure，启动即崩。
// 显式声明成 compileJava 的输出后，它会一起进缓存条目，FROM-CACHE 也能被正确还原。
tasks.named('compileJava', JavaCompile).configure {
    // 先编译第三方模组的编译期存根（src/compatApiStub）—— 注解处理器要靠它解析 @Mixin 的目标类
    dependsOn tasks.named('compileCompatApiStubJava')
    outputs.file(layout.buildDirectory.file("tmp/compileJava/${mod_id}.refmap.json"))
}

// ============================================================
// 打包：两个产物（assemble / build 一起产出，一内嵌一不内嵌）
//   <名>-<版本>.jar        不内嵌 —— 标准产物名。整合包自己装了 pinyin_search 时用它
//   <名>-<版本>-all.jar    内嵌 pinyin_search（Forge JAR-in-JAR）—— 没另装拼音库时用它
// 为什么不再合并：原先 `jar` 任务会把 jarJar 的 `META-INF/jarjar/**` 并进主产物，
//   于是主产物与 `-all` 内容逐字节相同 —— 一次构建出三个包（主产物 / `-all` / 过滤出来的
//   `-noembed`），分发时全靠肉眼分辨。现在不合并：主产物本身就不内嵌，`-all` 才内嵌，
//   两个包各自对应一种内容，名字也能看出区别，`-noembed` 变体因此不再需要。
// ============================================================
jarJar.enable()
tasks.named('assemble') { dependsOn tasks.named('jarJar') }

tasks.named('jar', Jar).configure {
    // 兜底校验：refmap 没进 jar 就直接让构建失败。
    // 缺 refmap 的 jar 依然能编译、能装、能启动到一半，只在 Mixin 注入阶段炸——
    // 这类「产得出来但必定崩」的包不应该被分发出去。
    doLast {
        def refmapName = "${mod_id}.refmap.json"
        def present = new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable {
            it.getEntry(refmapName) != null
        }
        if (!present) {
            throw new GradleException(
                    "jar 中缺少 ${refmapName}：Mixin 在生产环境无法重映射成员名，注入会全部 Critical injection failure。"
                            + "请确认 compileJava 不是从构建缓存恢复后丢了这个文件（见 mixin 配置下方的 outputs.file 声明）。")
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// gradle.properties 是 Java Properties 格式，Gradle 按 ISO-8859-1 读入 —— 因此含中文的 mod_authors
// 在展开进 mods.toml / jar 清单时会变成乱码（模组列表里作者显示成「ä½åæ¢æ å」）。
// 这里按 UTF-8 重新读一份，只用于「写进产物」的几处；其余数值属性保持 Gradle 原样读取。
def utf8Properties = new Properties()
file('gradle.properties').withInputStream { stream ->
    utf8Properties.load(new InputStreamReader(stream, 'UTF-8'))
}
def modAuthors = utf8Properties.getProperty('mod_authors', mod_authors)

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            forge_version: forge_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: modAuthors,
            mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

// 两个 jar 共用同一份清单属性（作者名用按 UTF-8 读出来的 modAuthors，见上面的说明）
def manifestAttributes = { Object archiveVersion ->
    return [
            "Specification-Title"     : mod_id,
            "Specification-Vendor"    : modAuthors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : archiveVersion.toString(),
            "Implementation-Vendor"   : modAuthors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
    ]
}

jar {
    manifest {
        attributes(manifestAttributes(project.jar.archiveVersion))
    }
}

jar.finalizedBy('reobfJar')

// 注：`<名>-<版本>.jar` 就是唯一产物（内容 = 编译产物 + 资源 + refmap，不带内嵌 jar）。
// reobf 是**就地改写** jar 任务的那份，所以 build\libs 里的就是重映射后的成品。


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('prepareGameTestStructures', Copy) {
    from 'src/gameTest/resources/gameteststructures'
    into '.modmind/gametest/gameteststructures'
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'prepareGameTestStructures'
}

// ============================================================
// 语言校验：Config.java 里的每个配置项都必须有 zh_cn / en_us 译文
//   Cloth Config 界面上的分类标题与条目名分别取
//     config.infinitestats.category.<分组>
//     config.infinitestats.<分组>.<键>
//   缺键时界面上会直接摆出键名（如 config.infinitestats.InfiniteEnergy.energyBlockRadius），
//   所以这里让「缺翻译」变成构建失败，别再靠人肉记。单独跑：gradlew checkLang
// ============================================================
tasks.register('checkLang') {
    group = 'verification'
    description = 'Check every Config.java config key has a zh_cn / en_us translation'
    def configJava = layout.projectDirectory.file('src/main/java/com/infinitestats/Config.java')
    def langDir = layout.projectDirectory.dir('src/main/resources/assets/infinitestats/lang')
    inputs.file(configJava)
    inputs.files(fileTree(langDir) { include '*.json' })

    doLast {
        def text = configJava.asFile.getText('UTF-8')
        def groups = new ArrayDeque()
        def entries = []
        text.eachLine { line ->
            def push = line =~ /builder\.push\("([^"]+)"\)/
            if (push.find()) {
                groups.push(push.group(1))
                return
            }
            if (line.contains('builder.pop()')) {
                if (!groups.isEmpty()) {
                    groups.pop()
                }
                return
            }
            def defined = line =~ /\.(defineInRange|defineList|defineEnum|define)\("([^"]+)"/
            if (defined.find()) {
                entries << [groups.isEmpty() ? 'ROOT' : groups.peek(), defined.group(2)]
            }
        }

        def missing = []
        ['zh_cn', 'en_us'].each { lang ->
            def json = new groovy.json.JsonSlurper().parse(new File(langDir.asFile, "${lang}.json"))
            entries.collect { it[0] }.unique().each { group ->
                // 注意：这里必须用 String 拼接，不能写成 "…${group}"——
                // GString 的 equals 与 String 不同，Map.containsKey(GString) 会永远匹配不到
                def key = 'config.infinitestats.category.' + group
                if (!json.containsKey(key)) {
                    missing << (lang + ': ' + key)
                }
            }
            entries.each { e ->
                def key = 'config.infinitestats.' + e[0] + '.' + e[1]
                if (!json.containsKey(key)) {
                    missing << (lang + ': ' + key)
                }
            }
        }

        if (!missing.isEmpty()) {
            throw new GradleException("Missing translation(s) for config keys (${missing.size()}):\n  "
                    + missing.unique().join("\n  "))
        }
        logger.lifecycle("checkLang: ${entries.size()} config keys OK (zh_cn / en_us)")
    }
}

tasks.named('check').configure { dependsOn tasks.named('checkLang') }
